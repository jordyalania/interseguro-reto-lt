<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1140" height="540" fill="#ffffff"/><text x="20" y="18.0" font-size="20" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">Hoy: por qué se duplican los desembolsos</text><text x="20" y="40.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#17222b">Lo rojo es donde nace el problema.</text><rect x="190" y="80" width="220" height="300" rx="6" fill="#f2f8f4" stroke="#8fb79f"/><text x="200" y="94.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">Google Cloud</text><rect x="440" y="80" width="470" height="300" rx="6" fill="#f6f7f2" stroke="#a3ad8a"/><text x="450" y="94.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">Sistemas internos (INARI)</text><polyline points="150,195.0 210,195.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="390,195.0 460,195.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="650,195.0 710,195.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="890,195.0 970,195.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="555.0,160 555,125 300,125 300.0,160" fill="none" stroke="#c0362c" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="90.0,230 90,310 300,310 300.0,230" fill="none" stroke="#c0362c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="160" width="120" height="70" rx="6" fill="#e3eefb" stroke="#4a7fc1" stroke-width="1.5"/><text x="90.0" y="195.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Cliente</text><rect x="210" y="160" width="180" height="70" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="300.0" y="187.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Zona Segura</text><text x="300.0" y="202.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">El cliente espera aquí</text><rect x="460" y="160" width="190" height="70" rx="6" fill="#fde8e6" stroke="#c0362c" stroke-width="1.5"/><text x="555.0" y="187.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Proxy de INARI</text><text x="555.0" y="202.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Responde 502 si hay demora</text><rect x="710" y="160" width="180" height="70" rx="6" fill="#fde8e6" stroke="#c0362c" stroke-width="1.5"/><text x="800.0" y="187.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">admwr-api</text><text x="800.0" y="202.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Sigue procesando igual</text><rect x="970" y="160" width="130" height="70" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="1035.0" y="187.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Banco</text><text x="1035.0" y="202.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Desembolso</text><rect x="30" y="420" width="560" height="77.0" rx="5" fill="#f7f9fb" stroke="#9fb0bd"/><text x="40" y="440" font-size="13" font-weight="bold" fill="#17222b">El problema en una frase</text><text x="40" y="458" font-size="12" fill="#17222b">El sistema responde "error" aunque el préstamo sí se está procesando, y el cliente lo</text><text x="40" y="473" font-size="12" fill="#17222b">   pide otra vez.</text><rect x="610" y="420" width="500" height="61.5" rx="5" fill="#f7f9fb" stroke="#9fb0bd"/><text x="620" y="440" font-size="13" font-weight="bold" fill="#17222b">Consecuencia</text><text x="620" y="458" font-size="12" fill="#17222b">El cliente recibe el dinero dos veces y recuperarlo es difícil.</text><rect x="155.0" y="186.0" width="50.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="180.0" y="195.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">1. Pide</text><rect x="397.0" y="186.0" width="56.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="425.0" y="195.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">2. Envía</text><rect x="643.0" y="186.0" width="74.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="680.0" y="195.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">3. Continúa</text><rect x="905.0" y="186.0" width="50.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="930.0" y="195.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">4. Paga</text><rect x="372.5" y="116.0" width="110.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="427.5" y="125.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">5. Devuelve error</text><rect x="38.0" y="301.0" width="314.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="195.0" y="310.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">6. Cree que falló y pide otra vez: vuelve al paso 1</text></svg>
