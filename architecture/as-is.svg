<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1094" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1500" height="1094" fill="#ffffff"/><text x="20" y="18.0" font-size="20" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">Situación actual (AS-IS): Préstamos de Renta Particular</text><text x="20" y="40.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#17222b">Flujo síncrono: lo marcado en rojo es donde nace el riesgo de desembolso duplicado.</text><rect x="290" y="60" width="800" height="260" rx="6" fill="#f2f8f4" stroke="#8fb79f"/><text x="300" y="74.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">GCP: zona privada de Interseguro / Zona Segura</text><rect x="290" y="335" width="800" height="560" rx="6" fill="#f6f7f2" stroke="#a3ad8a"/><text x="300" y="349.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">IS-VCE: VMware INARI, TAURO y SFTP</text><rect x="1130" y="60" width="340" height="835" rx="6" fill="#ececec" stroke="#a8a8a8"/><text x="1140" y="74.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">Servicios externos y bancos</text><polyline points="150,142.0 180,142.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="260,142.0 320,142.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="500,142.0 600,142.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="641.4,174 641.4,202.0 645.0,202.0 645.0,230" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="751.2,174 751.2,272.0 739.0,272.0 739.0,370" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="739.0,440 739.0,466.0 756.8,466.0 756.8,492" fill="none" stroke="#c0362c" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="150,532.0 180,532.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="260,532.0 320,532.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="500,532.0 600,532.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="796,532.0 860,532.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="698.0,572 698.0,616.0 700.0,616.0 700.0,660" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="790,692.0 1220,692.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="1310.0,724 1310.0,790" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="700.0,724 700.0,822.0 860,822.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="1060,822.0 1160,822 1160,300 1310,300 1310.0,254" fill="none" stroke="#c0362c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="110" width="120" height="64" rx="6" fill="#e3eefb" stroke="#4a7fc1" stroke-width="1.5"/><text x="90.0" y="134.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Clientes de</text><text x="90.0" y="149.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Renta Particular</text><rect x="180" y="110" width="80" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="220.0" y="142.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Proxy</text><rect x="320" y="110" width="180" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="410.0" y="134.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Portal Zona Segura</text><text x="410.0" y="149.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">(zona-segura-frontend)</text><rect x="600" y="110" width="180" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="690.0" y="134.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Backend Zona Segura</text><text x="690.0" y="149.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">(zona-segura-backend)</text><rect x="555" y="230" width="180" height="70" rx="14" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="645.0" y="257.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Base del portal</text><text x="645.0" y="272.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">(portal-db)</text><rect x="850" y="100" width="210" height="96" rx="6" fill="#fde8e6" stroke="#c0362c" stroke-width="1.5"/><text x="955.0" y="125.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">6. Punto de riesgo:</text><text x="955.0" y="140.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">el cliente espera en pantalla,</text><text x="955.0" y="155.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">un timeout parece un fallo</text><text x="955.0" y="170.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">y vuelve a solicitar</text><rect x="650" y="370" width="178" height="70" rx="6" fill="#fde8e6" stroke="#c0362c" stroke-width="1.5"/><text x="739.0" y="390.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Proxy de INARI</text><text x="739.0" y="405.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">responde 502 si hay</text><text x="739.0" y="420.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">lentitud o timeout</text><rect x="30" y="500" width="120" height="64" rx="6" fill="#e3eefb" stroke="#4a7fc1" stroke-width="1.5"/><text x="90.0" y="524.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Equipo de</text><text x="90.0" y="539.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Operaciones</text><rect x="180" y="500" width="80" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="220.0" y="532.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Proxy</text><rect x="320" y="500" width="180" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="410.0" y="524.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Consola ADMWR</text><text x="410.0" y="539.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">(.NET Forms)</text><rect x="600" y="492" width="196" height="80" rx="6" fill="#fde8e6" stroke="#c0362c" stroke-width="1.5"/><text x="698.0" y="517.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">admwr-api</text><text x="698.0" y="532.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Sigue procesando</text><text x="698.0" y="547.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">aunque ya hubo un 502</text><rect x="860" y="497" width="200" height="70" rx="14" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="960.0" y="524.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Base de préstamos</text><text x="960.0" y="539.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">(SQL Server en TAURO)</text><rect x="610" y="660" width="180" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="700.0" y="684.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">ultimus-api</text><text x="700.0" y="699.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Incidente de pago</text><rect x="860" y="790" width="200" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="960.0" y="814.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Servidor SFTP S42VP</text><text x="960.0" y="829.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Tramas ASBANC</text><rect x="1220" y="660" width="180" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="1310.0" y="692.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">ULTIMUS</text><rect x="1220" y="790" width="180" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="1310.0" y="822.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">EXACTUS</text><rect x="1220" y="190" width="180" height="64" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="1310.0" y="214.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">SFTP de los bancos</text><text x="1310.0" y="229.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Desembolso real</text><rect x="20" y="920" width="560" height="154.5" rx="5" fill="#f7f9fb" stroke="#9fb0bd"/><text x="30" y="940" font-size="13" font-weight="bold" fill="#17222b">Qué ocurre hoy, paso a paso</text><text x="30" y="958" font-size="12" fill="#17222b">1. El cliente solicita el préstamo y espera en pantalla.</text><text x="30" y="973" font-size="12" fill="#17222b">2. La Zona Segura guarda el evento y el cronograma.</text><text x="30" y="988" font-size="12" fill="#17222b">3. El backend envía la solicitud a INARI y espera la respuesta.</text><text x="30" y="1003" font-size="12" fill="#17222b">4. Si admwr-api demora, el proxy de INARI responde 502.</text><text x="30" y="1018" font-size="12" fill="#17222b">5. Aun así, admwr-api sigue procesando y registra el préstamo.</text><text x="30" y="1033" font-size="12" fill="#17222b">6. El cliente cree que falló y vuelve a solicitarlo.</text><text x="30" y="1048" font-size="12" fill="#17222b">7. Se genera otro incidente de pago y otra trama: hay un desembolso duplicado.</text><rect x="600" y="920" width="420" height="92.5" rx="5" fill="#f7f9fb" stroke="#9fb0bd"/><text x="610" y="940" font-size="13" font-weight="bold" fill="#17222b">Impacto</text><text x="610" y="958" font-size="12" fill="#17222b">- Dinero: varios desembolsos para la misma póliza.</text><text x="610" y="973" font-size="12" fill="#17222b">- Operación: pedir la devolución es complejo y manual.</text><text x="610" y="988" font-size="12" fill="#17222b">- Confianza: el cliente percibe el sistema como inestable.</text><rect x="1040" y="920" width="440" height="139.0" rx="5" fill="#f7f9fb" stroke="#9fb0bd"/><text x="1050" y="940" font-size="13" font-weight="bold" fill="#17222b">Causa raíz</text><text x="1050" y="958" font-size="12" fill="#17222b">- El cliente depende de una respuesta síncrona de INARI.</text><text x="1050" y="973" font-size="12" fill="#17222b">- Un 502 no significa que la operación falló.</text><text x="1050" y="988" font-size="12" fill="#17222b">- Ningún punto de la cadena reconoce dos intentos de la misma</text><text x="1050" y="1003" font-size="12" fill="#17222b">   operación.</text><text x="1050" y="1018" font-size="12" fill="#17222b">- El problema no es solo la lentitud: subir el timeout no elimina la</text><text x="1050" y="1033" font-size="12" fill="#17222b">   duplicidad.</text><rect x="283.0" y="133.0" width="14.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="290.0" y="142.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">1</text><rect x="519.0" y="126.0" width="62.0" height="32" fill="#ffffff" fill-opacity="0.94"/><text x="550.0" y="135.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Registrar</text><text x="550.0" y="149.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">préstamo</text><rect x="604.4" y="181.84" width="74.0" height="32" fill="#ffffff" fill-opacity="0.94"/><text x="641.4" y="190.84" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">2. Evento y</text><text x="641.4" y="204.84" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">cronograma</text><rect x="669.0" y="295.70399999999995" width="140.0" height="32" fill="#ffffff" fill-opacity="0.94"/><text x="739.0" y="304.70399999999995" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">3. Envía el cronograma</text><text x="739.0" y="318.70399999999995" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">y espera (síncrono)</text><rect x="698.9" y="450.0" width="98.0" height="32" fill="#ffffff" fill-opacity="0.94"/><text x="747.9" y="459.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">4. Sigue aunque</text><text x="747.9" y="473.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">haya 502</text><rect x="522.0" y="523.0" width="56.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="550.0" y="532.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Consulta</text><rect x="797.0" y="523.0" width="62.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="828.0" y="532.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">5. Guarda</text><rect x="638.0" y="607.0" width="122.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="699.0" y="616.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Genera el incidente</text><rect x="938.0" y="683.0" width="134.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="1005.0" y="692.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Registra el incidente</text><rect x="688.0" y="813.0" width="86.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="731.0" y="822.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Genera tramas</text><rect x="1114.0" y="537.9" width="92.0" height="32" fill="#ffffff" fill-opacity="0.94"/><text x="1160.0" y="546.9" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">7. Sin control</text><text x="1160.0" y="560.9" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">de duplicados</text></svg>
