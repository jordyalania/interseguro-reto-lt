<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1400" height="620" fill="#ffffff"/><text x="20" y="18.0" font-size="20" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">Propuesta: pedir dos veces ya no paga dos veces</text><text x="20" y="40.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#17222b">Azul: el cliente. Amarillo: se modifica. Verde: es nuevo. Sigue los números.</text><rect x="180" y="70" width="750" height="400" rx="6" fill="#f2f8f4" stroke="#8fb79f"/><text x="190" y="84.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">Google Cloud (Zona Segura)</text><rect x="960" y="70" width="230" height="400" rx="6" fill="#f6f7f2" stroke="#a3ad8a"/><text x="970" y="84.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#17222b">Sistemas internos</text><polyline points="150,168.0 200,168.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><polyline points="290.0,206 290.0,320" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="380,168.0 470,168.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="630,168.0 720,168.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="910,168.0 980,168.0" fill="none" stroke="#1f8a55" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="1075.0,206 1075.0,320" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="1170,168.0 1240,168.0" fill="none" stroke="#47586a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="910,347.0 945,347 945,191 980,190.8" fill="none" stroke="#1f8a55" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="720,365.0 380,365.0" fill="none" stroke="#47586a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="30" y="130" width="120" height="76" rx="6" fill="#e3eefb" stroke="#4a7fc1" stroke-width="1.5"/><text x="90.0" y="168.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Cliente</text><rect x="200" y="130" width="180" height="76" rx="6" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="290.0" y="160.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">API de préstamos</text><text x="290.0" y="175.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Responde "recibido"</text><rect x="470" y="130" width="160" height="76" rx="6" fill="#dcf5e8" stroke="#1f8a55" stroke-width="1.5"/><text x="550.0" y="160.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Cola de mensajes</text><text x="550.0" y="175.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">(Pub/Sub)</text><rect x="720" y="130" width="190" height="76" rx="6" fill="#dcf5e8" stroke="#1f8a55" stroke-width="1.5"/><text x="815.0" y="160.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Procesador</text><text x="815.0" y="175.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Atiende a ritmo seguro</text><rect x="980" y="130" width="190" height="76" rx="6" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="1075.0" y="160.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">admwr-api</text><text x="1075.0" y="175.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Acepta el número único</text><rect x="1240" y="130" width="130" height="76" rx="6" fill="#ffffff" stroke="#6b7c88" stroke-width="1.5"/><text x="1305.0" y="160.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Banco</text><text x="1305.0" y="175.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Desembolso</text><rect x="200" y="320" width="180" height="90" rx="14" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="290.0" y="357.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Base de operaciones</text><text x="290.0" y="372.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Número único y estado</text><rect x="720" y="320" width="190" height="90" rx="6" fill="#dcf5e8" stroke="#1f8a55" stroke-width="1.5"/><text x="815.0" y="357.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Conciliador</text><text x="815.0" y="372.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Resuelve los casos dudosos</text><rect x="980" y="320" width="190" height="90" rx="14" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="1075.0" y="357.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">TAURO</text><text x="1075.0" y="372.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Rechaza duplicados</text><rect x="30" y="500" width="420" height="77.0" rx="5" fill="#f7f9fb" stroke="#9fb0bd"/><text x="40" y="520" font-size="13" font-weight="bold" fill="#17222b">Idea 1: el cliente no espera</text><text x="40" y="538" font-size="12" fill="#17222b">Recibe "solicitud recibida" al instante y consulta el estado en</text><text x="40" y="553" font-size="12" fill="#17222b">   pantalla.</text><rect x="470" y="500" width="450" height="77.0" rx="5" fill="#f7f9fb" stroke="#9fb0bd"/><text x="480" y="520" font-size="13" font-weight="bold" fill="#17222b">Idea 2: cada solicitud tiene un número único</text><text x="480" y="538" font-size="12" fill="#17222b">Si llega repetida, se devuelve la que ya existe. La base de</text><text x="480" y="553" font-size="12" fill="#17222b">   operaciones y TAURO lo garantizan.</text><rect x="940" y="500" width="430" height="77.0" rx="5" fill="#f7f9fb" stroke="#9fb0bd"/><text x="950" y="520" font-size="13" font-weight="bold" fill="#17222b">Idea 3: ante la duda, primero se pregunta</text><text x="950" y="538" font-size="12" fill="#17222b">Si hay error o demora, no se reenvía. El conciliador consulta qué</text><text x="950" y="553" font-size="12" fill="#17222b">   pasó y actualiza el estado.</text><rect x="144.0" y="152.0" width="62.0" height="32" fill="#ffffff" fill-opacity="0.94"/><text x="175.0" y="161.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">1. Pide y</text><text x="175.0" y="175.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">consulta</text><rect x="259.0" y="254.0" width="62.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="290.0" y="263.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">2. Guarda</text><rect x="394.0" y="159.0" width="62.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="425.0" y="168.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">3. Encola</text><rect x="641.0" y="159.0" width="68.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="675.0" y="168.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">4. Entrega</text><rect x="917.0" y="159.0" width="56.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="945.0" y="168.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">5. Envía</text><rect x="1038.0" y="247.0" width="74.0" height="32" fill="#ffffff" fill-opacity="0.94"/><text x="1075.0" y="256.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">6. Registra</text><text x="1075.0" y="270.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">una vez</text><rect x="1180.0" y="159.0" width="50.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="1205.0" y="168.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">7. Paga</text><rect x="917.0" y="259.9" width="56.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="945.0" y="268.9" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Pregunta</text><rect x="489.0" y="356.0" width="122.0" height="18" fill="#ffffff" fill-opacity="0.94"/><text x="550.0" y="365.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#17222b">Actualiza el estado</text></svg>
