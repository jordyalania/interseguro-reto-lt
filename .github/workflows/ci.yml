name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  endorsement-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/endorsement-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/endorsement-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration

  routing-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/routing-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/routing-api/go.mod
          cache-dependency-path: services/routing-api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Comprueba los datos sintéticos y el escenario de la demo
        run: node ../../scripts/generate-synthetic-routes.mjs && git diff --exit-code -- src/data
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [endorsement-api, routing-api, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: endorsement-api
            context: services/endorsement-api
          - name: routing-api
            context: services/routing-api
          - name: web
            context: apps/web
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ${{ matrix.name }}:ci ${{ matrix.context }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
